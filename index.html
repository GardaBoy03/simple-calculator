<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kalkulator WhatsApp</title>
    <meta name="theme-color" content="#075e54">
    <meta name="description" content="Kalkulator pintar bergaya WhatsApp">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
    <form @submit.prevent class="wa-container">

        <div class="wa-main">

            <div class="wa-header">
                <div class="wa-header-info">
                    <div class="wa-avatar">🧮</div>
                    <div>
                        <h3>{{ t.title }}</h3>
                        <span class="wa-status">{{ t.online }}</span>
                    </div>
                </div>
                <div class="wa-lang-switch" role="group" aria-label="Language / Bahasa">
                    <button type="button"
                            class="wa-lang-btn"
                            :class="{ active: lang === 'id' }"
                            @click="playSound('click'); gantiBahasa('id')">🇮🇩 ID</button>
                    <button type="button"
                            class="wa-lang-btn"
                            :class="{ active: lang === 'en' }"
                            @click="playSound('click'); gantiBahasa('en')">🇬🇧 EN</button>
                </div>
            </div>

            <div class="wa-chat-body">

                <!-- Tab Switcher: Standar / Diskon -->
                <div class="persen-mode-tabs">
                    <button type="button"
                            class="persen-tab"
                            :class="{ active: activeTab === 'standar' }"
                            @click="playSound('click'); gantiTab('standar')">{{ t.tabStandar }}</button>
                    <button type="button"
                            class="persen-tab"
                            :class="{ active: activeTab === 'diskon' }"
                            @click="playSound('click'); gantiTab('diskon')">{{ t.tabDiskon }}</button>
                    <button type="button"
                            class="persen-tab"
                            :class="{ active: activeTab === 'satuan' }"
                            @click="playSound('click'); gantiTab('satuan')">{{ t.tabSatuan }}</button>
                </div>

                <template v-if="activeTab === 'standar'">
                    <p class="wa-petunjuk" v-html="t.hintKeys"></p>

                    <!-- Mode Kalkulator -->
                    <div class="std-kalkulator" tabindex="0" @keydown="stdKeydown">
                        <div class="std-layar">
                            <div class="std-ekspresi">{{ standar.exprText || '\u00A0' }}</div>
                            <div class="std-display">{{ standarDisplayFormatted }}</div>
                        </div>
                        <div class="std-keypad">
                            <button type="button" class="std-key std-key-fn" @click="playSound('click'); stdClear()">AC</button>
                            <button type="button" class="std-key std-key-fn" @click="playSound('click'); stdBackspace()">⌫</button>
                            <button type="button" class="std-key std-key-fn" @click="playSound('click'); stdPercent()">%</button>
                            <button type="button" class="std-key std-key-op" @click="playSound('click'); stdOperator('/')">÷</button>

                            <button type="button" class="std-key" @click="playSound('click'); stdDigit('7')">7</button>
                            <button type="button" class="std-key" @click="playSound('click'); stdDigit('8')">8</button>
                            <button type="button" class="std-key" @click="playSound('click'); stdDigit('9')">9</button>
                            <button type="button" class="std-key std-key-op" @click="playSound('click'); stdOperator('*')">×</button>

                            <button type="button" class="std-key" @click="playSound('click'); stdDigit('4')">4</button>
                            <button type="button" class="std-key" @click="playSound('click'); stdDigit('5')">5</button>
                            <button type="button" class="std-key" @click="playSound('click'); stdDigit('6')">6</button>
                            <button type="button" class="std-key std-key-op" @click="playSound('click'); stdOperator('-')">−</button>

                            <button type="button" class="std-key" @click="playSound('click'); stdDigit('1')">1</button>
                            <button type="button" class="std-key" @click="playSound('click'); stdDigit('2')">2</button>
                            <button type="button" class="std-key" @click="playSound('click'); stdDigit('3')">3</button>
                            <button type="button" class="std-key std-key-op" @click="playSound('click'); stdOperator('+')">+</button>

                            <button type="button" class="std-key std-key-fn" @click="playSound('click'); stdToggleSign()">±</button>
                            <button type="button" class="std-key" @click="playSound('click'); stdDigit('0')">0</button>
                            <button type="button" class="std-key" @click="playSound('click'); stdDecimal()">,</button>
                            <button type="button" class="std-key std-key-eq" @click="playSound('click'); stdEquals()">=</button>
                        </div>
                    </div>
                    <p class="mode-hint">{{ t.hintCalc }}</p>
                </template>

                <template v-if="activeTab === 'diskon'">
                    <p class="wa-petunjuk">{{ t.hintDiskon }}</p>

                    <!-- Mode Kalkulator Diskon -->
                    <div class="single-col-grid">
                        <div class="input-group">
                            <label>{{ t.diskonHargaAwal }}</label>
                            <input type="text"
                                   inputmode="numeric"
                                   :value="diskon.hargaDisplay"
                                   @input="diskonHargaInput"
                                   @keyup.enter="diskonHitung"
                                   :placeholder="t.diskonPlaceholderHarga">
                        </div>
                        <div class="input-group">
                            <label>{{ t.diskonPersen1 }}</label>
                            <input type="text"
                                   inputmode="decimal"
                                   v-model="diskon.persen1"
                                   @keyup.enter="diskonHitung"
                                   :placeholder="t.diskonPlaceholderPersen">
                        </div>
                        <div class="input-group">
                            <label>{{ t.diskonPersen2 }} <span style="font-weight:400; color:#999;">({{ t.diskonOpsional }})</span></label>
                            <input type="text"
                                   inputmode="decimal"
                                   v-model="diskon.persen2"
                                   @keyup.enter="diskonHitung"
                                   :placeholder="t.diskonPlaceholderPersen">
                        </div>

                        <p v-if="diskon.error" style="color:#d9534f; font-size:12.5px; margin:0; font-weight:600;">{{ diskon.error }}</p>

                        <div class="wa-action-buttons">
                            <button type="button" class="btn-hitung" @click="playSound('click'); diskonHitung()">{{ t.diskonHitungBtn }}</button>
                            <button type="button" class="btn-reset" @click="playSound('click'); diskonReset()">{{ t.diskonResetBtn }}</button>
                        </div>
                    </div>

                    <div class="wa-bubble-container" v-if="diskon.hasil">
                        <div class="wa-bubble-hasil">
                            <span class="wa-label-hasil">{{ t.diskonHasilLabel }}</span>

                            <div class="hasil-multi-row">
                                <span class="hasil-multi-label">{{ t.diskonHargaAwalLabel }}</span>
                                <span class="hasil-multi-val">Rp {{ formatRupiah(diskon.hasil.hargaAwal) }}</span>
                            </div>
                            <div class="hasil-multi-row">
                                <span class="hasil-multi-label">{{ t.diskonTotalPotongan }} ({{ formatPersenHasil(diskon.hasil.persenEfektif) }}%)</span>
                                <span class="hasil-multi-val">− Rp {{ formatRupiah(diskon.hasil.totalPotongan) }}</span>
                            </div>

                            <span class="wa-label-hasil" style="margin-top:6px;">{{ t.diskonHargaAkhir }}</span>
                            <h1>Rp {{ formatRupiah(diskon.hasil.hargaAkhir) }}</h1>
                        </div>
                    </div>
                </template>

                <template v-if="activeTab === 'satuan'">
                    <p class="wa-petunjuk">{{ t.hintSatuan }}</p>

                    <!-- Mode Kalkulator Konversi Satuan -->
                    <div class="single-col-grid">
                        <div class="input-group">
                            <label>{{ t.satuanKategori }}</label>
                            <select v-model="satuan.kategori" @change="playSound('click'); satuanGantiKategori()">
                                <option value="panjang">{{ t.satuanPanjang }}</option>
                                <option value="berat">{{ t.satuanBerat }}</option>
                                <option value="volume">{{ t.satuanVolume }}</option>
                                <option value="suhu">{{ t.satuanSuhu }}</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <label>{{ t.satuanDari }}</label>
                            <div class="satuan-field">
                                <input type="text"
                                       inputmode="decimal"
                                       v-model="satuan.nilaiDari"
                                       :placeholder="t.satuanPlaceholder">
                                <select v-model="satuan.unitDari">
                                    <option v-for="u in satuanUnitList" :key="u.key" :value="u.key">{{ satuanUnitLabel(u.key) }}</option>
                                </select>
                            </div>
                        </div>

                        <div class="satuan-swap-wrap">
                            <button type="button" class="satuan-swap-btn" @click="playSound('click'); satuanSwap()" :aria-label="t.satuanTukar">⇅</button>
                        </div>

                        <div class="input-group">
                            <label>{{ t.satuanKe }}</label>
                            <select v-model="satuan.unitKe">
                                <option v-for="u in satuanUnitList" :key="u.key" :value="u.key">{{ satuanUnitLabel(u.key) }}</option>
                            </select>
                        </div>
                    </div>

                    <div class="wa-bubble-container" v-if="satuan.nilaiDari !== ''">
                        <div class="wa-bubble-hasil">
                            <span class="wa-label-hasil">{{ t.satuanHasilLabel }}</span>
                            <div class="hasil-multi-row">
                                <span class="hasil-multi-label">{{ formatSatuanAngka(satuanNilaiDariNum) }} {{ satuanUnitLabel(satuan.unitDari) }}</span>
                            </div>
                            <h1>{{ satuanHasilFormatted }} {{ satuanUnitLabel(satuan.unitKe) }}</h1>
                        </div>
                    </div>
                </template>

            </div>

        </div><!-- /.wa-main -->
    </form>
</div>

<script src="vue.js"></script>
<script src="apps.js"></script>
</body>
</html>
