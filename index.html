<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <form @submit.prevent class="calculator-card">
            <div id="judul">
                <h2>Simple Calculator</h2>
            </div>
            
            <div class="calculator-grid">
                <div class="input-group">
                    <label>Bilangan 1</label>
                    <input 
                        type="number"
                        name="input_bill"
                        v-model="bill"
                        placeholder="0">
                </div>

                <div class="input-group">
                    <label>Operasi</label>
                    <select v-model="operasi">
                        <option value="+">+</option>
                        <option value="-">-</option>
                        <option value="*">x</option>
                        <option value="/">/</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Bilangan 2</label>
                    <input 
                        type="number"
                        name="input_bil2"
                        v-model="bil2"
                        placeholder="0">
                </div>
            </div>

            <div id="hasil">
                <h1>{{ hasil }}</h1>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
    <script src="app.js"></script>
</body>
</html>
