<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kalkulator WhatsApp</title>
    <meta name="theme-color" content="#075e54">
    <meta name="description" content="Kalkulator pintar bergaya WhatsApp">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
    <form @submit.prevent class="wa-container">

        <!-- ── Sidebar ala WhatsApp Web (hanya tampil di layar desktop) ── -->
        <aside class="wa-sidebar">
            <div class="wa-sidebar-header">
                <div class="wa-avatar wa-avatar-sidebar">🧮</div>
                <h3 class="wa-sidebar-title">{{ t.title }}</h3>
                <div class="wa-lang-switch wa-lang-switch-sidebar" role="group" aria-label="Language / Bahasa">
                    <button type="button"
                            class="wa-lang-btn"
                            :class="{ active: lang === 'id' }"
                            @click="playSound('click'); gantiBahasa('id')">🇮🇩</button>
                    <button type="button"
                            class="wa-lang-btn"
                            :class="{ active: lang === 'en' }"
                            @click="playSound('click'); gantiBahasa('en')">🇬🇧</button>
                </div>
            </div>
            <div class="wa-sidebar-search">
                <span class="wa-sidebar-search-icon" aria-hidden="true">🔍</span>
                <span class="wa-sidebar-search-text">{{ t.title }}</span>
            </div>
            <nav class="wa-sidebar-list">
                <button v-for="tab in tabs"
                        :key="tab.id"
                        type="button"
                        class="wa-sidebar-item"
                        :class="{ active: modeAktif === tab.id }"
                        @click="playSound('click'); gantiMode(tab.id)">
                    <span class="wa-sidebar-item-avatar">{{ tab.id === 'standar' ? '🔢' : '🕒' }}</span>
                    <span class="wa-sidebar-item-info">
                        <strong>{{ t[tab.key] }}</strong>
                        <small v-if="tab.id === 'riwayat'">{{ t.historyCount(riwayat.length) }}</small>
                        <small v-else>{{ t.online }}</small>
                    </span>
                </button>
            </nav>
        </aside>

        <div class="wa-main">

        <div class="wa-header">
            <div class="wa-header-info">
                <div class="wa-avatar">🧮</div>
                <div>
                    <h3>{{ t.title }}</h3>
                    <span class="wa-status">{{ t.online }}</span>
                </div>
            </div>
            <div class="wa-lang-switch" role="group" aria-label="Language / Bahasa">
                <button type="button"
                        class="wa-lang-btn"
                        :class="{ active: lang === 'id' }"
                        @click="playSound('click'); gantiBahasa('id')">🇮🇩 ID</button>
                <button type="button"
                        class="wa-lang-btn"
                        :class="{ active: lang === 'en' }"
                        @click="playSound('click'); gantiBahasa('en')">🇬🇧 EN</button>
            </div>
        </div>

        <div class="wa-chat-body">

            <div class="mode-select-wrapper">
                <select class="mode-select" v-model="modeAktif" @change="gantiMode(modeAktif)">
                    <option v-for="tab in tabs" :key="tab.id" :value="tab.id">{{ t[tab.key] }}</option>
                </select>
                <span class="mode-select-arrow" aria-hidden="true"></span>
            </div>

            <p class="wa-petunjuk" v-html="t.hintKeys"></p>

            <div v-if="modeAktif === 'standar'">
                <!-- Mode Kalkulator -->
                <div class="std-kalkulator" tabindex="0" @keydown="stdKeydown">
                    <div class="std-layar">
                        <div class="std-ekspresi">{{ standar.exprText || '\u00A0' }}</div>
                        <div class="std-display">{{ standarDisplayFormatted }}</div>
                    </div>
                    <div class="std-keypad">
                        <button type="button" class="std-key std-key-fn" @click="playSound('click'); stdClear()">AC</button>
                        <button type="button" class="std-key std-key-fn" @click="playSound('click'); stdBackspace()">⌫</button>
                        <button type="button" class="std-key std-key-fn" @click="playSound('click'); stdPercent()">%</button>
                        <button type="button" class="std-key std-key-op" @click="playSound('click'); stdOperator('/')">÷</button>

                        <button type="button" class="std-key" @click="playSound('click'); stdDigit('7')">7</button>
                        <button type="button" class="std-key" @click="playSound('click'); stdDigit('8')">8</button>
                        <button type="button" class="std-key" @click="playSound('click'); stdDigit('9')">9</button>
                        <button type="button" class="std-key std-key-op" @click="playSound('click'); stdOperator('*')">×</button>

                        <button type="button" class="std-key" @click="playSound('click'); stdDigit('4')">4</button>
                        <button type="button" class="std-key" @click="playSound('click'); stdDigit('5')">5</button>
                        <button type="button" class="std-key" @click="playSound('click'); stdDigit('6')">6</button>
                        <button type="button" class="std-key std-key-op" @click="playSound('click'); stdOperator('-')">−</button>

                        <button type="button" class="std-key" @click="playSound('click'); stdDigit('1')">1</button>
                        <button type="button" class="std-key" @click="playSound('click'); stdDigit('2')">2</button>
                        <button type="button" class="std-key" @click="playSound('click'); stdDigit('3')">3</button>
                        <button type="button" class="std-key std-key-op" @click="playSound('click'); stdOperator('+')">+</button>

                        <button type="button" class="std-key std-key-fn" @click="playSound('click'); stdToggleSign()">±</button>
                        <button type="button" class="std-key" @click="playSound('click'); stdDigit('0')">0</button>
                        <button type="button" class="std-key" @click="playSound('click'); stdDecimal()">,</button>
                        <button type="button" class="std-key std-key-eq" @click="playSound('click'); stdEquals()">=</button>
                    </div>
                </div>
                <p class="mode-hint">{{ t.hintCalc }}</p>
            </div>

            <div v-if="modeAktif === 'riwayat'">
                <div class="wa-history-full">
                    <div class="wa-history-header">
                        <span class="wa-history-count">{{ t.historyCount(riwayat.length) }}</span>
                        <div class="wa-history-actions">
                            <button type="button"
                                    class="btn-history-action btn-drive"
                                    :class="{ 'btn-drive-connected': driveConnected }"
                                    @click="playSound('click'); toggleDrive()"
                                    :title="driveConnected ? t.driveDisconnectTitle : t.driveConnectTitle">
                                {{ driveConnected ? t.driveConnectedBtn : t.driveConnectBtn }}
                            </button>
                            <button type="button" class="btn-history-action" @click="playSound('click'); exportRiwayat()" :title="t.exportTitle">{{ t.exportBtn }}</button>
                            <button type="button" class="btn-history-action" @click="playSound('click'); importRiwayat()" :title="t.importTitle">{{ t.importBtn }}</button>
                            <button v-if="riwayat.length > 0" type="button" class="btn-clear-all" @click="playSound('click'); hapusSemua()">{{ t.clearAllBtn }}</button>
                        </div>
                    </div>
                    <div v-if="driveConnected" class="drive-info" v-html="t.driveFolderInfo(driveFolderName)"></div>
                    <div v-if="syncStatus" class="sync-status" :class="syncStatus.type">
                        {{ syncStatus.message }}
                    </div>

                    <div v-if="riwayat.length === 0" class="wa-history-empty">
                        <p>{{ t.historyEmpty }}</p>
                    </div>
                    <div v-else class="wa-history-full-list">
                        <div class="wa-bubble-history" v-for="item in riwayat" :key="item.id">
                            <button type="button" class="btn-delete-item" @click="playSound('click'); hapusSatu(item.id)">×</button>
                            <span class="wa-history-text">{{ item.teks }}</span>
                            <strong class="wa-history-total">{{ item.total }}</strong>
                            <span class="wa-history-time">{{ item.waktu }} ✓</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        </div><!-- /.wa-main -->
    </form>
</div>

<script src="vue.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js"></script>
<script src="apps.js"></script>
</body>
</html>
