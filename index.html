<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kalkulator WhatsApp</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#075e54">
    <meta name="description" content="Kalkulator pintar bergaya WhatsApp">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Apple / iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Kalkulator">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <link rel="apple-touch-startup-image" href="assets/icons/icon-512.png">

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app">
        <form @submit.prevent class="wa-container">

            <div class="wa-header">
                <div class="wa-header-info">
                    <div class="wa-avatar">🧮</div>
                    <div>
                        <h3>Kalkulator Pintar</h3>
                        <span class="wa-status">Online</span>
                    </div>
                </div>
                <!-- Tombol install muncul otomatis jika belum di-install -->
                <button
                    type="button"
                    id="btn-install"
                    class="btn-install-pwa"
                    v-show="showInstallBtn"
                    @click="installApp"
                    title="Install Aplikasi">
                    ⬇ Install
                </button>
            </div>

            <!-- Banner install untuk iOS (tidak ada event beforeinstallprompt) -->
            <div class="ios-install-banner" v-show="showIosBanner">
                <span>📲 Tap <b>Share</b> lalu <b>"Add to Home Screen"</b> untuk install.</span>
                <button type="button" @click="tutupIosBanner" class="btn-tutup-banner">✕</button>
            </div>

            <div class="wa-chat-body">
                <p class="wa-petunjuk">Tekan <b>Enter</b> untuk hitung • <b>Esc</b> untuk reset</p>

                <div class="calculator-grid">
                    <div class="input-group">
                        <label>Angka 1</label>
                        <input
                            type="text"
                            inputmode="numeric"
                            v-model="billFormat"
                            @keydown.enter="hitung"
                            @keydown.esc="resetKalkulator"
                            placeholder="0">
                    </div>

                    <div class="input-group">
                        <label>Operasi</label>
                        <select v-model="operasi" @keydown.enter="hitung" @keydown.esc="resetKalkulator">
                            <option value="+">+</option>
                            <option value="-">−</option>
                            <option value="*">×</option>
                            <option value="/">÷</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Angka 2</label>
                        <input
                            type="text"
                            inputmode="numeric"
                            v-model="bil2Format"
                            @keydown.enter="hitung"
                            @keydown.esc="resetKalkulator"
                            placeholder="0">
                    </div>
                </div>

                <div class="wa-action-buttons">
                    <button type="button" @click="hitung" class="btn-hitung">Hitung</button>
                    <button type="button" @click="resetKalkulator" class="btn-reset">Reset</button>
                </div>

                <div class="wa-bubble-container">
                    <div class="wa-bubble-hasil">
                        <span class="wa-label-hasil">Hasil Akhir:</span>
                        <h1>{{ formatRibuan(hasilKalkulasi) }}</h1>
                        <span class="wa-time">Baru saja ✓✓</span>
                    </div>
                </div>

                <div class="wa-history-section" v-if="riwayat.length > 0">
                    <div class="wa-history-header">
                        <div class="wa-history-title-wrapper">
                            <span>🕒 Riwayat</span>
                            <button type="button" @click="toggleRiwayat" class="btn-toggle-history">
                                {{ tampilkanRiwayat ? '[ Sembunyikan ]' : '[ Tampilkan ]' }}
                            </button>
                        </div>
                        <button type="button" @click="hapusSemua" class="btn-clear-all">Hapus Semua</button>
                    </div>

                    <div class="wa-history-list" v-show="tampilkanRiwayat">
                        <div class="wa-bubble-history" v-for="item in riwayat" :key="item.id">
                            <button type="button" class="btn-delete-item" @click="hapusSatu(item.id)">×</button>
                            <span class="wa-history-text">{{ item.teks }}</span>
                            <strong class="wa-history-total">{{ item.total }}</strong>
                            <span class="wa-history-time">{{ item.waktu }} ✓</span>
                        </div>
                    </div>
                </div>

            </div>

        </form>
    </div>

    <script src="vue.js"></script>
    <script src="apps.js"></script>
    <script>
        // Registrasi Service Worker untuk PWA / Offline Support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('✅ Service Worker terdaftar!', reg.scope))
                    .catch(err => console.warn('❌ SW gagal:', err));
            });
        }
    </script>
</body>
</html>
